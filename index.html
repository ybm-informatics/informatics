<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홍길동 | 자기소개</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6ee7b7;
    --accent2: #60a5fa;
    --text: #eaeaea;
    --muted: #9aa0ab;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #0f1115, #191c24);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    max-width: 720px;
    width: 100%;
    background: var(--card);
    border-radius: 20px;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .profile {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    color: #0f1115;
    flex-shrink: 0;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }

  .role {
    color: var(--muted);
    font-size: 16px;
  }

  .intro {
    font-size: 16px;
    line-height: 1.8;
    color: #d4d7dd;
    margin-bottom: 32px;
    padding-bottom: 32px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .section-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 14px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 32px;
  }

  .tag {
    background: rgba(110, 231, 183, 0.1);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    border: 1px solid rgba(110, 231, 183, 0.25);
  }

  .contacts {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .contacts a {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.2s ease;
  }

  .contacts a:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--accent2);
  }

  @media (max-width: 480px) {
    .card { padding: 32px 24px; }
    .profile { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="profile">
    <div class="avatar">홍</div>
    <div>
      <h1>홍길동</h1>
      <div class="role">Frontend Developer</div>
    </div>
  </div>

  <p class="intro">
    안녕하세요, 사용자에게 좋은 경험을 만드는 것을 좋아하는 개발자 홍길동입니다.
    새로운 기술을 배우는 것을 즐기며, 작은 디테일까지 신경 쓰는 것을 중요하게 생각합니다.
    함께 성장할 수 있는 팀과 프로젝트를 찾고 있습니다.
  </p>

  <div class="section-title">관심 분야 & 기술</div>
  <div class="tags">
    <span class="tag">JavaScript</span>
    <span class="tag">React</span>
    <span class="tag">TypeScript</span>
    <span class="tag">UI/UX</span>
    <span class="tag">Node.js</span>
  </div>

  <div class="section-title">연락처</div>
  <div class="contacts">
    <a href="mailto:example@email.com">✉️ example@email.com</a>
    <a href="https://github.com/example" target="_blank" rel="noopener">🐙 GitHub</a>
    <a href="https://linkedin.com/in/example" target="_blank" rel="noopener">💼 LinkedIn</a>
  </div>
</div>

</body>
</html>
